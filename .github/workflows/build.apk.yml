name: Build PulseKey APK

on:
workflow_dispatch:
push:
branches: [main]

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout source
    uses: actions/checkout@v5

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Flutter
    uses: subosito/flutter-action@v2
    with:
      channel: stable
      flutter-version: '3.24.5'
      cache: true

  - name: Create Android project files
    run: flutter create --platforms=android --org com.rohitjagtap --project-name pulsekey .

  - name: Set Android SDK 35
    run: |
      sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' android/app/build.gradle

      grep -q 'compileSdk = 35' android/app/build.gradle || {
        echo "ERROR: Failed to set compileSdk to 35"
        exit 1
      }

  - name: Set app name
    run: |
      sed -i 's/android:label="[^"]*"/android:label="PulseKey"/' android/app/src/main/AndroidManifest.xml

  - name: Install dependencies
    run: flutter pub get

  - name: Analyze Dart code
    run: flutter analyze --no-fatal-infos --no-fatal-warnings

  - name: Run Flutter tests
    run: flutter test

  - name: Build release APK
    run: flutter build apk --release

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: pulsekey-release-apk
      path: build/app/outputs/flutter-apk/app-release.apk
