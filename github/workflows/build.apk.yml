name: Build Timer APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          flutter create --platforms=android --org com.rohitjagtap --project-name pulsekey .
          sed -i 's/android:label="[^"]*"/android:label="Timer"/' android/app/src/main/AndroidManifest.xml

      - name: Set up release signing
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/timer.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/timer.jks" >> "$GITHUB_ENV"
          python3 tools/patch_signing.py

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icon
        if: hashFiles('timer_icon.png') != ''
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Show signing certificate
        continue-on-error: true
        run: keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | grep -E "Owner|SHA256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: timer-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
